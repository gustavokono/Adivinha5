<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adivinha 5 — Jogo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF7F0;
    --bg-panel: #FFFFFF;
    --ink: #1E2A38;
    --ink-soft: #5B6B7A;
    --indigo: #16324F;
    --tile-correct: #2C5F8A;
    --tile-correct-dark: #1F4766;
    --tile-present: #C89B3C;
    --tile-present-dark: #A67F2C;
    --tile-absent: #ABA398;
    --tile-absent-dark: #8F887E;
    --border: #DCD5C7;
    --white: #FFFFFF;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom: 40px;
  }

  /* Azulejo pattern strip — signature element */
  .azulejo-strip{
    width:100%;
    height:14px;
    background-image: repeating-linear-gradient(45deg, var(--indigo) 0 6px, transparent 6px 12px),
                       repeating-linear-gradient(-45deg, var(--indigo) 0 6px, transparent 6px 12px);
    background-color: #E8DFC8;
    background-size: 24px 24px;
    opacity:0.85;
  }

  header{
    width:100%;
    background: var(--indigo);
    color: var(--white);
    text-align:center;
    padding: 28px 16px 22px;
  }

  header h1{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size: clamp(32px, 6vw, 46px);
    margin:0;
    letter-spacing: 0.5px;
  }

  header h1 .five{
    color: var(--tile-present);
  }

  header p{
    margin: 8px 0 0;
    font-size: 14px;
    color: #C7D3DE;
    font-weight:500;
  }

  .mode-bar{
    display:flex;
    gap:10px;
    margin-top: 18px;
    flex-wrap: wrap;
    justify-content:center;
  }

  .mode-btn{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: 13px;
    letter-spacing:0.3px;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,0.35);
    background: transparent;
    color: #E8E3D8;
    cursor:pointer;
    transition: all .15s ease;
  }
  .mode-btn.active{
    background: var(--tile-present);
    border-color: var(--tile-present);
    color: var(--indigo);
  }
  .mode-btn:hover{ border-color: var(--tile-present); }

  main{
    width:100%;
    max-width: 480px;
    padding: 24px 16px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  #message{
    min-height: 22px;
    font-weight:700;
    font-size: 14px;
    color: var(--indigo);
    background: #F0E9D6;
    padding: 6px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    opacity:0;
    transition: opacity .2s ease;
  }
  #message.show{ opacity:1; }

  #grid{
    display:grid;
    grid-template-rows: repeat(7, 1fr);
    gap: 7px;
    margin-bottom: 8px;
  }

  .row{
    display:grid;
    grid-template-columns: repeat(5, 54px);
    gap: 7px;
  }

  .tile{
    width:54px;
    height:54px;
    border: 2px solid var(--border);
    background: var(--bg-panel);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 26px;
    color: var(--ink);
    border-radius: 6px;
    text-transform:uppercase;
    transition: transform .15s ease;
  }

  .tile.filled{ border-color: var(--ink-soft); }

  .tile.pop{ animation: pop .1s ease; }
  @keyframes pop{ 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }

  .tile.flip{ animation: flip .5s ease forwards; }
  @keyframes flip{
    0%{ transform: rotateX(0deg); }
    50%{ transform: rotateX(90deg); }
    51%{ transform: rotateX(90deg); }
    100%{ transform: rotateX(0deg); }
  }

  .tile.correct{ background: var(--tile-correct); border-color: var(--tile-correct-dark); color: var(--white); }
  .tile.present{ background: var(--tile-present); border-color: var(--tile-present-dark); color: var(--white); }
  .tile.absent{ background: var(--tile-absent); border-color: var(--tile-absent-dark); color: var(--white); }
  .tile.guessed{ background: var(--indigo); border-color: var(--indigo); color: var(--white); }
  .tile.editable{ cursor: pointer; }
  .tile.cursor{ border-color: var(--tile-present); box-shadow: 0 0 0 2px var(--tile-present) inset; }

  #newWordBtn{
    display:none;
    margin: 4px 0 10px;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--tile-present);
    background: var(--tile-present);
    color: var(--indigo);
    cursor:pointer;
  }
  #newWordBtn.show{ display:inline-block; }
  #newWordBtn:hover{ filter: brightness(1.05); }

  .row-stats{
    grid-column: 1 / -1;
    font-size: 11px;
    font-weight:600;
    color: var(--ink-soft);
    display:flex;
    gap:10px;
    justify-content:center;
    min-height: 14px;
    padding-top:1px;
  }
  .row-stats span{ display:flex; align-items:center; gap:3px; }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dot.c{ background: var(--tile-correct); }
  .dot.p{ background: var(--tile-present); }
  .dot.a{ background: var(--tile-absent); }

  #keyboard{
    margin-top: 18px;
    display:flex;
    flex-direction:column;
    gap: 8px;
    width:100%;
    max-width: 480px;
    align-items:center;
  }

  .krow{ display:flex; gap:6px; justify-content:center; width:100%; }

  .key{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    background: #E4DFD3;
    color: var(--ink);
    height: 46px;
    min-width: 32px;
    flex:1;
    max-width: 40px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background .1s ease;
    text-transform:uppercase;
  }
  .key:hover{ background: #D6CFBE; }
  .key.wide{ max-width: 64px; font-size: 11px; flex:1.6; }

  .key.used{ background: var(--ink-soft); color: var(--white); }

  #stats-panel{
    margin-top: 22px;
    background: var(--bg-panel);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    color: var(--ink-soft);
    text-align:center;
    max-width: 400px;
  }
  #stats-panel b{ color: var(--indigo); }

  footer{
    margin-top: 26px;
    font-size: 11px;
    color: var(--ink-soft);
    text-align:center;
    padding: 0 20px;
  }

  @media (max-width: 380px){
    .tile{ width: 46px; height:46px; font-size:22px; }
    .row{ grid-template-columns: repeat(5, 46px); }
  }
</style>
</head>
<body>

<div class="azulejo-strip"></div>
<header>
  <h1>Adivinha<span class="five">5</span></h1>
  <p>Descubra a palavra de 5 letras em 7 tentativas</p>
  <div class="mode-bar">
    <button class="mode-btn active" data-mode="daily" id="btnDaily">Desafio do dia</button>
    <button class="mode-btn" data-mode="practice" id="btnPractice">Modo prático</button>
  </div>
</header>

<main>
  <div id="message"></div>
  <button id="newWordBtn">🔀 Nova palavra (modo prático)</button>
  <div id="grid"></div>
  <input id="hiddenInput" type="text" autocomplete="off" autocorrect="off"
    autocapitalize="characters" spellcheck="false" inputmode="text" maxlength="1"
    style="position:absolute; opacity:0; height:1px; width:1px; border:none; padding:0; margin:0; pointer-events:none;">

  <div id="keyboard">
    <div class="krow">
      <button class="key" data-key="Q">Q</button><button class="key" data-key="W">W</button>
      <button class="key" data-key="E">E</button><button class="key" data-key="R">R</button>
      <button class="key" data-key="T">T</button><button class="key" data-key="Y">Y</button>
      <button class="key" data-key="U">U</button><button class="key" data-key="I">I</button>
      <button class="key" data-key="O">O</button><button class="key" data-key="P">P</button>
    </div>
    <div class="krow">
      <button class="key" data-key="A">A</button><button class="key" data-key="S">S</button>
      <button class="key" data-key="D">D</button><button class="key" data-key="F">F</button>
      <button class="key" data-key="G">G</button><button class="key" data-key="H">H</button>
      <button class="key" data-key="J">J</button><button class="key" data-key="K">K</button>
      <button class="key" data-key="L">L</button>
    </div>
    <div class="krow">
      <button class="key wide" data-key="ENTER">Enviar</button>
      <button class="key" data-key="Z">Z</button><button class="key" data-key="X">X</button>
      <button class="key" data-key="C">C</button><button class="key" data-key="V">V</button>
      <button class="key" data-key="B">B</button><button class="key" data-key="N">N</button>
      <button class="key" data-key="M">M</button>
      <button class="key wide" data-key="BACK">⌫</button>
    </div>
  </div>

  <div id="stats-panel">
    <div id="statsText">Jogadas: <b>0</b> · Vitórias: <b>0</b> · Sequência: <b>0</b></div>
  </div>

  <footer>Feito para você jogar quantas vezes quiser no modo prático. O desafio do dia muda uma vez por dia.</footer>
</main>

  const WORDS_SET = new Set(WORDS);


  const MAX_TRIES = 7;
  const WORD_LEN = 5;

  let mode = "daily";
  let answer = "";
  let guesses = [];
  let currentGuess = new Array(WORD_LEN).fill("");
  let cursorPos = 0;
  let gameOver = false;
  let keyState = {};
  let lastPracticeWord = "";

  let stats = { played:0, won:0, streak:0 };

  function pickDailyWord(){
    const epoch = new Date(2024,0,1);
    const today = new Date();
    const diffDays = Math.floor((today - epoch) / 86400000);
    return WORDS[diffDays % WORDS.length];
  }

  function pickRandomWord(){
    let word = WORDS[Math.floor(Math.random() * WORDS.length)];
    let attempts = 0;
    while(word === lastPracticeWord && attempts < 10){
      word = WORDS[Math.floor(Math.random() * WORDS.length)];
      attempts++;
    }
    lastPracticeWord = word;
    return word;
  }

  function normalize(s){
    return s.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function startGame(newMode){
    mode = newMode;
    answer = mode === "daily" ? pickDailyWord() : pickRandomWord();
    guesses = [];
    currentGuess = new Array(WORD_LEN).fill("");
    cursorPos = 0;
    gameOver = false;
    keyState = {};
    document.getElementById("btnDaily").classList.toggle("active", mode === "daily");
    document.getElementById("btnPractice").classList.toggle("active", mode === "practice");
    document.getElementById("newWordBtn").classList.toggle("show", mode === "practice");
    buildGrid();
    resetKeyboardColors();
    showMessage("");
    render();
  }

  function buildGrid(){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    for(let r=0; r<MAX_TRIES; r++){
      const row = document.createElement("div");
      row.className = "row";
      row.id = "row-" + r;
      for(let c=0; c<WORD_LEN; c++){
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.id = "tile-" + r + "-" + c;
        tile.addEventListener("click", () => selectTile(r, c));
        row.appendChild(tile);
      }
      const statsRow = document.createElement("div");
      statsRow.className = "row-stats";
      statsRow.id = "stats-" + r;
      row.appendChild(statsRow);
      grid.appendChild(row);
    }
  }

  function evaluateGuess(guess){
    const result = new Array(WORD_LEN).fill("absent");
    const answerArr = answer.split("");
    const guessArr = guess.split("");
    const used = new Array(WORD_LEN).fill(false);

    for(let i=0; i<WORD_LEN; i++){
      if(guessArr[i] === answerArr[i]){
        result[i] = "correct";
        used[i] = true;
      }
    }
    for(let i=0; i<WORD_LEN; i++){
      if(result[i] === "correct") continue;
      for(let j=0; j<WORD_LEN; j++){
        if(!used[j] && guessArr[i] === answerArr[j]){
          result[i] = "present";
          used[j] = true;
          break;
        }
      }
    }
    return result;
  }

  function render(){
    guesses.forEach((g, r) => {
      const result = evaluateGuess(g.word);
      let counts = {correct:0, present:0, absent:0};
      for(let c=0; c<WORD_LEN; c++){
        const tile = document.getElementById("tile-" + r + "-" + c);
        tile.textContent = g.word[c];
        tile.classList.remove("editable", "cursor");
        tile.classList.add("filled");
        if(g.revealed){
          tile.classList.add("guessed");
        }
        counts[result[c]]++;
      }
      if(g.revealed){
        document.getElementById("stats-" + r).innerHTML =
          `<span><span class="dot c"></span>${counts.correct} na posição certa</span>` +
          `<span><span class="dot p"></span>${counts.present} na palavra, posição errada</span>` +
          `<span><span class="dot a"></span>${counts.absent} não estão na palavra</span>`;
      }
    });

    const activeRow = guesses.length;
    if(activeRow < MAX_TRIES && !gameOver){
      for(let c=0; c<WORD_LEN; c++){
        const tile = document.getElementById("tile-" + activeRow + "-" + c);
        if(tile){
          tile.textContent = currentGuess[c] || "";
          tile.classList.toggle("filled", !!currentGuess[c]);
          tile.classList.add("editable");
          tile.classList.toggle("cursor", c === cursorPos);
        }
      }
    }

    updateKeyboardColors();
    updateStatsPanel();
  }

  function selectTile(r, c){
    if(gameOver) return;
    if(r !== guesses.length) return; // só a linha atual pode ser editada
    cursorPos = c;
    render();
    focusHiddenInput();
  }

  function focusHiddenInput(){
    const input = document.getElementById("hiddenInput");
    if(!input) return;
    input.value = "";
    input.focus({ preventScroll: true });
  }

  function updateKeyboardColors(){
    document.querySelectorAll(".key[data-key]").forEach(btn => {
      const k = btn.dataset.key;
      if(k.length === 1 && keyState[k]){
        btn.classList.add("used");
      }
    });
  }

  function resetKeyboardColors(){
    document.querySelectorAll(".key[data-key]").forEach(btn => {
      btn.classList.remove("used");
    });
  }

  function updateStatsPanel(){
    document.getElementById("statsText").innerHTML =
      `Jogadas: <b>${stats.played}</b> · Vitórias: <b>${stats.won}</b> · Sequência: <b>${stats.streak}</b>`;
  }

  function showMessage(text, sticky){
    const el = document.getElementById("message");
    el.textContent = text;
    if(!text){ el.classList.remove("show"); return; }
    el.classList.add("show");
    if(!sticky){
      clearTimeout(showMessage._t);
      showMessage._t = setTimeout(() => { el.classList.remove("show"); }, 1800);
    }
  }

  function submitGuess(){
    if(gameOver) return;
    if(currentGuess.some(l => !l)){
      showMessage("Preencha as 5 letras antes de enviar.");
      shakeRow(guesses.length);
      return;
    }
    const word = currentGuess.join("");
    if(!WORDS_SET.has(word)){
      showMessage("Essa palavra não está na lista. Tente outra.");
      shakeRow(guesses.length);
      return;
    }
    for(let i=0; i<WORD_LEN; i++){
      keyState[word[i]] = "used";
    }
    guesses.push({ word, revealed:true });
    currentGuess = new Array(WORD_LEN).fill("");
    cursorPos = 0;
    render();
    animateRowFlip(guesses.length - 1);

    if(word === answer){
      gameOver = true;
      stats.played++; stats.won++; stats.streak++;
      updateStatsPanel();
      setTimeout(() => showMessage("Muito bem! A palavra era " + answer + ".", true), 550);
    } else if(guesses.length >= MAX_TRIES){
      gameOver = true;
      stats.played++; stats.streak = 0;
      updateStatsPanel();
      setTimeout(() => showMessage("Não foi dessa vez. A palavra era " + answer + ".", true), 550);
    }
  }

  function shakeRow(r){
    const row = document.getElementById("row-" + r);
    if(!row) return;
    row.style.transform = "translateX(-4px)";
    setTimeout(() => { row.style.transform = "translateX(4px)"; }, 60);
    setTimeout(() => { row.style.transform = "translateX(0)"; }, 120);
  }

  function animateRowFlip(r){
    for(let c=0; c<WORD_LEN; c++){
      const tile = document.getElementById("tile-" + r + "-" + c);
      tile.style.animationDelay = (c * 90) + "ms";
      tile.classList.add("flip");
    }
  }

  function nextEmptyFrom(pos){
    for(let i=pos; i<WORD_LEN; i++){
      if(!currentGuess[i]) return i;
    }
    for(let i=0; i<WORD_LEN; i++){
      if(!currentGuess[i]) return i;
    }
    return Math.min(pos, WORD_LEN - 1);
  }

  function handleKey(k){
    if(gameOver) return;
    if(k === "ENTER"){
      submitGuess();
    } else if(k === "BACK" || k === "BACKSPACE"){
      if(currentGuess[cursorPos]){
        currentGuess[cursorPos] = "";
      } else if(cursorPos > 0){
        cursorPos--;
        currentGuess[cursorPos] = "";
      }
      render();
    } else if(/^[A-Z]$/.test(k)){
      currentGuess[cursorPos] = k;
      const filledPos = cursorPos;
      cursorPos = nextEmptyFrom(cursorPos + 1);
      render();
      const tile = document.getElementById("tile-" + guesses.length + "-" + filledPos);
      if(tile){ tile.classList.add("pop"); setTimeout(() => tile.classList.remove("pop"), 100); }
    }
  }

  function moveCursor(delta){
    if(gameOver) return;
    if(guesses.length >= MAX_TRIES) return;
    cursorPos = Math.max(0, Math.min(WORD_LEN - 1, cursorPos + delta));
    render();
  }

  document.querySelectorAll(".key[data-key]").forEach(btn => {
    btn.addEventListener("click", () => {
      handleKey(btn.dataset.key);
      btn.blur();
    });
  });

  const hiddenInput = document.getElementById("hiddenInput");

  document.addEventListener("keydown", (e) => {
    if(e.target === hiddenInput) return; // evita processar a tecla duas vezes
    let k = e.key.toUpperCase();
    if(k === "ENTER"){
      e.preventDefault();
      handleKey("ENTER");
    } else if(k === "BACKSPACE"){
      e.preventDefault();
      handleKey("BACK");
    } else if(e.key === "ArrowLeft"){
      e.preventDefault();
      moveCursor(-1);
    } else if(e.key === "ArrowRight"){
      e.preventDefault();
      moveCursor(1);
    } else {
      k = normalize(k);
      if(/^[A-Z]$/.test(k)) handleKey(k);
    }
  });

  hiddenInput.addEventListener("input", (e) => {
    const raw = e.target.value;
    e.target.value = "";
    if(!raw) return;
    const letter = normalize(raw.slice(-1));
    if(/^[A-Z]$/.test(letter)) handleKey(letter);
  });
  hiddenInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
      e.preventDefault();
      handleKey("ENTER");
    } else if(e.key === "Backspace" && !e.target.value){
      e.preventDefault();
      handleKey("BACK");
    } else if(e.key === "ArrowLeft"){
      e.preventDefault();
      moveCursor(-1);
    } else if(e.key === "ArrowRight"){
      e.preventDefault();
      moveCursor(1);
    }
  });
  document.getElementById("grid").addEventListener("click", () => {
    if(!gameOver) focusHiddenInput();
  });

  document.getElementById("btnDaily").addEventListener("click", (e) => { startGame("daily"); e.currentTarget.blur(); });
  document.getElementById("btnPractice").addEventListener("click", (e) => { startGame("practice"); e.currentTarget.blur(); });
  document.getElementById("newWordBtn").addEventListener("click", (e) => { startGame("practice"); e.currentTarget.blur(); });

  startGame("daily");
})();
</script>
</body>
</html>
